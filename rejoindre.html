<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bannière Apple : « Ouvrir » si Ramio est installé (app 6788317282),
       avec le lien courant transmis à l'app. -->
  <meta name="apple-itunes-app" id="smart-banner" content="app-id=6788317282">
  <title>Rejoindre une partie - Ramio</title>
  <style>
    :root { --vin: #7B1E3B; --vin2: #5E1229; --sable: #F3E3C8; --encre: #2A1B14; --brume: rgba(255,255,255,0.86); }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--encre);
      background: #d9a36a url("assets/rejoindre-fond.jpg") center 45% / cover no-repeat fixed;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(42,27,20,0.10) 0%, rgba(42,27,20,0.28) 60%, rgba(42,27,20,0.55) 100%);
      pointer-events: none;
    }
    @media (max-aspect-ratio: 4/5) {
      body { background-image: url("assets/rejoindre-fond-portrait.jpg"); background-position: center 30%; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .carte { animation: monter 480ms ease-out both; }
      @keyframes monter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    }
    .carte {
      position: relative;
      background: var(--brume);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 22px;
      padding: 30px 26px 24px;
      max-width: 420px;
      width: calc(100% - 32px);
      margin: 24px 16px;
      box-shadow: 0 18px 50px rgba(42,27,20,0.35);
    }
    .marque {
      font-size: 0.78em;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--vin);
      font-weight: 700;
      margin: 0 0 10px;
    }
    h1 { color: var(--encre); font-size: 1.45em; line-height: 1.25; margin: 0 0 16px; text-wrap: balance; }
    .code {
      font-size: 2em;
      letter-spacing: 0.22em;
      font-weight: 700;
      background: var(--sable);
      color: var(--vin2);
      border-radius: 12px;
      padding: 12px 8px 12px 16px;
      margin: 8px 0 18px;
    }
    #code-intro { margin: 0 0 6px; color: #5b4a40; }
    a.bouton {
      display: block;
      background: var(--vin);
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      padding: 14px;
      margin: 10px 0;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(123,30,59,0.28);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    a.bouton:hover, a.bouton:focus-visible { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(123,30,59,0.34); outline: none; }
    a.bouton:focus-visible { box-shadow: 0 0 0 3px rgba(123,30,59,0.45); }
    a.secondaire { background: rgba(123,30,59,0.08); color: var(--vin2); border: 1.5px solid rgba(123,30,59,0.35); box-shadow: none; }
    a.secondaire:hover, a.secondaire:focus-visible { background: rgba(123,30,59,0.14); box-shadow: none; }
    .note { font-size: 0.88em; line-height: 1.45; color: #5b4a40; margin: 16px 0 0; }
    #beta { font-size: 0.8em; color: #7a6a5f; margin-top: 12px; }
    footer { position: fixed; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 0.75em; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.75); text-shadow: 0 1px 6px rgba(42,27,20,0.6); pointer-events: none; }
  </style>
</head>
<body>
  <div class="carte">
    <p class="marque">Ramio</p>
    <h1 id="titre">Invitation à une partie de Ramio</h1>
    <p id="code-intro">Ton code d'accès :</p>
    <div class="code" id="code">------</div>
    <a class="bouton" id="ouvrir" href="#">Ouvrir dans l'app Ramio</a>
    <a class="bouton secondaire" id="play" href="https://play.google.com/store/apps/details?id=com.ramio">
      Installer Ramio sur Google Play
    </a>
    <a class="bouton secondaire" id="ios" href="https://testflight.apple.com/join/X8tt9MQw">
      iPhone : rejoindre la bêta TestFlight
    </a>
    <p class="note" id="note"></p>
    <p class="note" id="beta"></p>
  </div>
  <footer>Quintain Games</footer>
  <script>
    // Page de repli des liens profonds de Ramio (2026-09-05, refonte) :
    // quatre cas — salon (code), « Bats mon temps » (defi + temps),
    // défi POSTÉ sur les réseaux (defi seul), PARRAINAGE (ami=<uid>) —
    // en français ou en anglais selon le navigateur (ou ?lang=).
    // Sur Android, le Play Store transmet le « referrer » à l'app au
    // premier lancement : on y glisse le canal, le parrain ou le défi,
    // pour que l'app reprenne l'invitation sans rouvrir le lien.
    var params = new URLSearchParams(location.search);
    var clean = function (v, n) {
      return (v || "").replace(/[^a-zA-Z0-9_-]/g, "").slice(0, n || 40);
    };
    var code = clean(params.get("code"), 8).toUpperCase();
    var type = params.get("type") || "";
    var defi = clean(params.get("defi"), 16);
    var temps = params.get("temps") || "";
    var ami = clean(params.get("ami"), 36);
    var de = (params.get("de") || "").slice(0, 20);
    var src = clean(params.get("src"), 40);
    var lang = params.get("lang") ||
      ((navigator.language || "fr").toLowerCase().indexOf("fr") === 0 ? "fr" : "en");
    if (lang !== "fr") lang = "en";
    document.documentElement.lang = lang;

    var cas = ami ? "ami" : defi ? (temps ? "beat" : "puzzle") :
      type === "course" ? "course" : type === "differe" ? "differe" : "salon";

    var T = {
      fr: {
        salon: "Invitation à une partie de Ramio",
        course: "Invitation à un duel de défis Ramio",
        differe: "Invitation à une partie de Ramio en différé",
        beat: "Défi « Bats mon temps » Ramio",
        puzzle: "Un défi Ramio à résoudre",
        ami: de ? de + " t'invite à jouer à Ramio" : "Invitation à jouer à Ramio",
        codeIntro: "Ton code d'accès :",
        ouvrir: "Ouvrir dans l'app Ramio",
        play: "Installer Ramio sur Google Play",
        ios: "iPhone : rejoindre la bêta TestFlight",
        noteSalon: "Si l'app est installée, ce lien l'ouvre directement. Sinon, " +
          "installe Ramio puis saisis le code ci-dessus dans « Salon privé › " +
          "Rejoindre » (ou « Défis › Rejoindre » pour un duel).",
        noteBeat: "Ouvre ce lien sur ton téléphone avec Ramio installé : le défi " +
          "se lance directement, avec le temps de ton ami à battre. Sinon, " +
          "installe Ramio puis rouvre le lien.",
        notePuzzle: "Ouvre ce lien sur ton téléphone avec Ramio installé : le " +
          "défi se lance directement. Sinon, installe Ramio puis rouvre le lien. " +
          "Tu peux réorganiser toute la table ; le but est de poser toutes " +
          "les cartes de ta main.",
        noteAmi: "Installe Ramio par ce lien et crée ton compte : tu reçois " +
          "300 jetons (offre de la bêta). Sur Android, l'app te reconnaît " +
          "après l'installation ; sur iPhone, rouvre ce lien une fois l'app " +
          "installée.",
        beta: "Ramio est en bêta ouverte : le jeu est gratuit, on peut y jouer " +
          "sans compte, et tout ce qui se débloque reste acquis."
      },
      en: {
        salon: "You're invited to a Ramio game",
        course: "You're invited to a Ramio puzzle duel",
        differe: "You're invited to a Ramio correspondence game",
        beat: "Ramio challenge: beat my time",
        puzzle: "A Ramio puzzle to solve",
        ami: de ? de + " invites you to play Ramio" : "You're invited to play Ramio",
        codeIntro: "Your room code:",
        ouvrir: "Open in the Ramio app",
        play: "Get Ramio on Google Play",
        ios: "iPhone: join the TestFlight beta",
        noteSalon: "If the app is installed, this link opens it directly. " +
          "Otherwise install Ramio, then enter the code above in " +
          "“Private room › Join” (or “Puzzles › Join” for a duel).",
        noteBeat: "Open this link on your phone with Ramio installed: the " +
          "puzzle starts right away, with your friend's time to beat. " +
          "Otherwise install Ramio, then open the link again.",
        notePuzzle: "Open this link on your phone with Ramio installed: the " +
          "puzzle starts right away. Otherwise install Ramio, then open the " +
          "link again. You may rearrange the whole table; the goal is to " +
          "play every card from your hand.",
        noteAmi: "Install Ramio through this link and create your account: " +
          "you get 300 tokens (beta offer). On Android the app recognises " +
          "you after installing; on iPhone, open this link again once the " +
          "app is installed.",
        beta: "Ramio is in open beta: the game is free, you can play without " +
          "an account, and everything you unlock stays yours."
      }
    }[lang];

    var el = function (id) { return document.getElementById(id); };
    document.title = T[cas] + " - Ramio";
    el("titre").textContent = T[cas];
    el("code-intro").textContent = T.codeIntro;
    el("ouvrir").textContent = T.ouvrir;
    el("play").textContent = T.play;
    el("ios").textContent = T.ios;
    el("beta").textContent = T.beta;
    if (code) {
      el("code").textContent = code;
      el("note").textContent = T.noteSalon;
    } else {
      el("code-intro").style.display = "none";
      el("code").style.display = "none";
      el("note").textContent = cas === "ami" ? T.noteAmi :
        cas === "beat" ? T.noteBeat : cas === "puzzle" ? T.notePuzzle : T.noteSalon;
    }

    // Referrer Play : canal + ce que l'app doit reprendre après l'install.
    var utm = "utm_source=" + (src || "lien") + "&utm_medium=rejoindre&utm_campaign=" + cas;
    if (ami) utm += "&ami=" + ami;
    if (defi) utm += "&defi=" + defi;
    el("play").href = "https://play.google.com/store/apps/details?id=com.ramio&referrer=" +
      encodeURIComponent(utm);

    // Force l'ouverture dans l'app sur Android quand la page s'est
    // ouverte dans le navigateur malgré l'app installée. Sur iPhone,
    // Safari ne connaît pas intent:// (« adresse non valide », retour
    // Tristan 05/09) et rien ne peut forcer un lien universel depuis la
    // page elle-même : le bouton disparaît, la note dit le bon geste, et
    // la bannière Apple propose « Ouvrir » si l'app est installée.
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if (ios) {
      el("ouvrir").style.display = "none";
      el("note").textContent = (lang === "fr"
        ? "Sur iPhone, ce lien s'ouvre directement dans Ramio quand tu le touches depuis Messages, WhatsApp ou Mail, une fois l'app installée. "
        : "On iPhone, this link opens straight in Ramio when you tap it from Messages, WhatsApp or Mail, once the app is installed. ")
        + el("note").textContent;
      try {
        el("smart-banner").setAttribute("content",
          "app-id=6788317282, app-argument=" + location.href);
      } catch (e) {}
    } else {
      el("ouvrir").href = "intent://" + location.host + location.pathname.replace(/\.html$/, "") + location.search +
        "#Intent;scheme=https;package=com.ramio;end";
    }

    // Mesure (même RPC que le site : migration 74) : visite + clics stores.
    var log = function (kind) {
      try {
        fetch("https://zkrkaimrybxbdrznxhxx.supabase.co/rest/v1/rpc/log_site_visit", {
          method: "POST", keepalive: true,
          headers: {
            apikey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprcmthaW1yeWJ4YmRyem54aHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMDkzMTYsImV4cCI6MjA5NjY4NTMxNn0.28Ns814SQSFXaKRR0-ZrHoX1G8Cpnhf6sNCZ6kgtAio",
            Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprcmthaW1yeWJ4YmRyem54aHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMDkzMTYsImV4cCI6MjA5NjY4NTMxNn0.28Ns814SQSFXaKRR0-ZrHoX1G8Cpnhf6sNCZ6kgtAio",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ p_kind: kind, p_src: src || "rejoindre-" + cas, p_lang: lang, p_ref: "" })
        }).catch(function () {});
      } catch (e) {}
    };
    el("play").addEventListener("click", function () { log("play"); });
    el("ios").addEventListener("click", function () { log("testflight"); });
    log("visit");
  </script>
</body>
</html>
